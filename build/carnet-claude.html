<title>Carnet de l'entraîneur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : bande « pas de tir » vert gazon en tête (marque + onglets), puis une page de carnet quadrillée sur ~920px.
   Chiffres en type tableau d'affichage de stade, titres de section manuscrits comme sur un carnet, jaune et rouge du blason en ponctuation. */
:root {
  --bg: #edf0e8;          /* papier, léger vert */
  --grid: rgba(31, 79, 52, .07);
  --surface: #fbfcf7;
  --sunk: #e3e8dc;
  --ink: #18261d;         /* encre vert-noir */
  --muted: #56655a;
  --line: #c9d3c3;
  --field: #1e4d33;       /* gazon du terrain */
  --field-2: #173d28;
  --field-ink: #f3f6ee;
  --field-muted: #a9c4b0;
  --accent: #1f6b43;      /* vert d'action */
  --accent-ink: #ffffff;
  --gold: #e0ac12;        /* jaune du blason */
  --danger: #c0352a;      /* rouge du blason */
  --danger-ink: #ffffff;
  --ok: #24804c;
  --ok-soft: #dcefe2;
  --font-display: "Big Shoulders Display", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-hand: "Kalam", "Segoe Print", "Bradley Hand", cursive;
  --radius: 6px;
  --p-r: #c8281e; --p-b: #2a5fae; --p-v: #1d8a3a;  /* couleurs de priorité de la fiche */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1712; --grid: rgba(160, 210, 180, .05); --surface: #15221a; --sunk: #1c2c22; --ink: #e6eee5; --muted: #98aa9c;
    --line: #2a3d31; --field: #10291b; --field-2: #0b1f14; --field-ink: #eef4ea; --field-muted: #8fb39a;
    --accent: #4fbf7e; --accent-ink: #08170e; --gold: #f2c443; --danger: #ef6a5c; --danger-ink: #1b0907; --ok: #55b97f; --ok-soft: #173525;
    --p-r: #ff7a6c; --p-b: #7aaaf0; --p-v: #62cc80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1712; --grid: rgba(160, 210, 180, .05); --surface: #15221a; --sunk: #1c2c22; --ink: #e6eee5; --muted: #98aa9c;
  --line: #2a3d31; --field: #10291b; --field-2: #0b1f14; --field-ink: #eef4ea; --field-muted: #8fb39a;
  --accent: #4fbf7e; --accent-ink: #08170e; --gold: #f2c443; --danger: #ef6a5c; --danger-ink: #1b0907; --ok: #55b97f; --ok-soft: #173525;
  --p-r: #ff7a6c; --p-b: #7aaaf0; --p-v: #62cc80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 920px; margin: 0 auto; padding-block: 10px 0; display: grid; gap: 8px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; letter-spacing: .01em; margin: 0; text-transform: uppercase; }
.brand .sub { color: var(--muted); font-size: .85rem; margin-left: auto; text-align: right; }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 14px; font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .n { font-family: var(--font-body); font-size: .75rem; font-weight: 600; color: var(--muted); margin-left: 4px; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 96px; }
.wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 16px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .9rem; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }

.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bar .grow { flex: 1 1 200px; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 14px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
input[type=search], input[type=text], input[type=date], input[type=time], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 11px; }
textarea { min-height: 90px; resize: vertical; }

h2.sec { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: .95rem; color: var(--muted); margin: 8px 0 -4px; }
.list { display: grid; gap: 8px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; gap: 14px; align-items: center; text-align: left; width: 100%; }
.row:hover { border-color: var(--muted); }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 600; display: block; }
.row .main > .m:not([style]), .row .main > .tirline { display: block; }
.row .m { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }
.date { width: 52px; flex: none; text-align: center; font-family: var(--font-display); line-height: 1; }
.date .d { font-size: 1.7rem; font-weight: 700; display: block; }
.date .mo { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.count { font-variant-numeric: tabular-nums; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; white-space: nowrap; }
.count small { color: var(--muted); font-weight: 500; font-size: .85rem; }
.tag { display: inline-block; font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.tag.today { background: var(--gold); color: #1d1600; }
.tag.fed { background: transparent; border: 1px solid var(--line); color: var(--ink); letter-spacing: .03em; }
.cren-list { display: grid; gap: 8px; }
.cren { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1.4fr auto; gap: 6px; align-items: center; }
.cren .x { border: 0; background: none; color: var(--muted); font-size: 1.3rem; padding: 4px 8px; }
@media (max-width: 560px) { .cren { grid-template-columns: 1fr 1fr; } .cren .g { grid-column: 1 / 2; } }
.fedbox { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; }
.fedbox legend { font-family: var(--font-display); font-weight: 600; letter-spacing: .05em; padding: 0 4px; }
.scroll { overflow-x: auto; }
table.vol { border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 100%; }
table.vol th, table.vol td { padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--line); }
table.vol thead th { font-size: .75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
table.vol tbody th { color: var(--muted); font-weight: 600; text-align: left; }
table.vol td.vs, table.vol td.cum { font-weight: 700; }
table.vol td.cum { color: var(--muted); }
table.vol td[class^="k-"] { border-radius: 0; font-weight: 700; }
.pad { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.key { min-height: 58px; border-radius: 10px; border: 1px solid rgba(0,0,0,.18); font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; }
.key:disabled { opacity: .35; }
.k-gold { background: #f2c200; color: #1a1400; }
.k-red { background: #d7312a; color: #ffffff; }
.k-blue { background: #2a7fd0; color: #ffffff; }
.k-black { background: #1d1d1f; color: #ffffff; }
.k-white { background: #fafafa; color: #111111; }
.k-miss { background: var(--sunk); color: var(--muted); }
.radio { display: flex; gap: 6px; flex-wrap: wrap; }
.radio label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; color: var(--ink); font-weight: 500; }
.radio input { accent-color: var(--accent); }
.prev { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.tirline { font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sbar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--sunk); min-width: 120px; }
.sbar span { display: block; height: 100%; }
.s-ac { background: var(--ok); } .s-ec { background: var(--gold); } .s-na { background: var(--accent); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.el { display: grid; gap: 2px; }
.el + .el { border-top: 1px solid var(--line); padding-top: 10px; }
.el h4 { margin: 0 0 4px; font-family: var(--font-display); font-size: 1.05rem; text-transform: uppercase; letter-spacing: .04em; }
.crit { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; padding: 4px 0; }
.crit .lbl { flex: 1 1 220px; min-width: 0; }
.crit { border-left: 4px solid transparent; padding-left: 10px; margin-left: -14px; }
.crit.p-r { border-left-color: var(--p-r); } .crit.p-r .lbl { color: var(--p-r); }
.crit.p-b { border-left-color: var(--p-b); } .crit.p-b .lbl { color: var(--p-b); }
.crit.p-v { border-left-color: var(--p-v); } .crit.p-v .lbl { color: var(--p-v); }
.pdot-r { background: var(--p-r); } .pdot-b { background: var(--p-b); } .pdot-v { background: var(--p-v); } .pdot-n { background: var(--ink); }
.crit .before { display: block; font-size: .78rem; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { border: 0; background: var(--surface); padding: 9px 11px; font-size: .85rem; font-weight: 600; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"][data-v="0"] { background: var(--accent); color: var(--accent-ink); }
.seg button[aria-pressed="true"][data-v="1"] { background: var(--gold); color: #1d1600; }
.seg button[aria-pressed="true"][data-v="2"] { background: var(--ok); color: var(--surface); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; text-transform: uppercase; }
.crumbs button { border: 0; background: none; padding: 2px 4px; color: var(--muted); font: inherit; text-transform: inherit; }
.crumbs b { padding: 2px 4px; }
.crumbs span { color: var(--muted); }
.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.fold { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; gap: 10px; align-items: center; text-align: left; min-width: 0; }
.fold:hover { border-color: var(--muted); }
.fold svg { flex: none; }
.fold .t { font-weight: 600; overflow-wrap: anywhere; }
.fold .m { color: var(--muted); font-size: .8rem; }
.thumb { width: 54px; height: 54px; border-radius: 8px; flex: none; object-fit: cover; background: var(--sunk); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: .9rem; color: var(--muted); letter-spacing: .04em; }
.drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 16px; color: var(--muted); font-size: .9rem; text-align: center; }
.drop.over { border-color: var(--accent); background: var(--sunk); color: var(--ink); }
details.pick { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.pick summary { cursor: pointer; padding: 10px 12px; font-weight: 600; }
details.pick label { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); font-size: .95rem; }
details.pick input { accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
.sheet.doc { width: min(960px, 100%); max-height: 96vh; }
.pdfbox { overflow: auto; display: grid; gap: 10px; justify-items: start; background: var(--sunk); border-radius: 8px; padding: 1px; max-width: 100%; }
.pdfbox .pdfpage { display: block; background: #ffffff; box-shadow: 0 1px 4px rgba(0,0,0,.2); max-width: none; }
.txtbox { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--sunk); border-radius: 8px; padding: 12px; margin: 0; max-height: 60vh; overflow: auto; font-size: .9rem; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.grid5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
table.recap td.txt { text-align: left; color: var(--muted); font-size: .85rem; min-width: 110px; }
table.recap th, table.recap td { white-space: nowrap; } table.recap td.txt { white-space: normal; }
.lnk { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.hbars { display: grid; gap: 8px; }
.hb { display: grid; grid-template-columns: 90px 1fr auto; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
.hb .hl { font-size: .9rem; color: var(--muted); }
.hb .ht { height: 14px; background: var(--sunk); border-radius: 0 4px 4px 0; overflow: hidden; }
.hb .ht span { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.hb .hv { font-weight: 600; min-width: 84px; text-align: right; } .hb .hv small { color: var(--muted); font-weight: 500; }
svg.chart { width: 100%; min-width: 320px; height: auto; display: block; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .ax { fill: var(--muted); font-size: 12px; font-family: var(--font-body); font-variant-numeric: tabular-nums; }
svg.chart .val { fill: var(--ink); font-size: 13px; font-weight: 600; font-family: var(--font-body); }
svg.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.chart .area { fill: var(--accent); fill-opacity: .08; stroke: none; }
svg.chart .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
svg.chart .pt.last { fill: var(--accent); stroke-width: 3; }
svg.chart .hit { fill: transparent; }
.viewer-media { max-width: 100%; max-height: 60vh; border-radius: 8px; display: block; margin: 0 auto; background: var(--sunk); }
.clubline { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: .85rem; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 24px; display: grid; gap: 10px; justify-items: start; }
.empty h3 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; text-transform: uppercase; letter-spacing: .02em; }
.empty p { margin: 0; color: var(--muted); max-width: 60ch; }
.steps { margin: 0; padding-left: 20px; color: var(--muted); }

/* Séance détail */
.head { display: grid; gap: 4px; }
.head h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.8rem; margin: 0; text-transform: uppercase; text-wrap: balance; }
.head .m { color: var(--muted); }
.score { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-display); }
.score b { font-size: 2.4rem; font-variant-numeric: tabular-nums; }
.attend { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.pt { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; align-items: center; gap: 10px; text-align: left; min-height: 60px; }
.pt .box { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.pt[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); }
.pt[aria-pressed="true"] .box { background: var(--ok); border-color: var(--ok); }
.pt[aria-pressed="true"] .box::after { content: ""; width: 7px; height: 12px; border: solid var(--surface); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px,-1px); }
.pt .nm { font-weight: 600; min-width: 0; }
.pt .sm { display: block; color: var(--muted); font-size: .8rem; font-weight: 400; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
label.f { display: grid; gap: 4px; font-size: .85rem; font-weight: 600; color: var(--muted); }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-weight: 500; color: var(--ink); font-size: .9rem; }
.checks input { accent-color: var(--accent); }
.hist { display: flex; flex-wrap: wrap; gap: 4px; }
.hist span { width: 18px; height: 18px; border-radius: 4px; background: var(--sunk); }
.hist span.on { background: var(--ok); }
.stat { display: flex; gap: 24px; flex-wrap: wrap; }
.stat div { display: grid; }
.stat b { font-family: var(--font-display); font-size: 1.8rem; font-variant-numeric: tabular-nums; line-height: 1; }
.stat span { color: var(--muted); font-size: .85rem; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, 38px); gap: 8px; }
.swatches button, .sw-custom { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); position: relative; }
.swatches button[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
.swatches button.used::after { content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 2px; background: var(--surface); transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
.sw-custom { display: grid; place-items: center; cursor: pointer; background: conic-gradient(#c23a2c, #f2c200, #2c8452, #2f7fc1, #7a4fb5, #c23a2c); overflow: hidden; }
.sw-custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; border: 0; padding: 0; }
.sw-custom span { font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); pointer-events: none; font-size: 1.2rem; }

/* Panneau d'édition */
.sheet-bg { position: fixed; inset: 0; background: rgba(8,14,18,.45); z-index: 20; display: grid; align-items: end; justify-items: center; }
@media (min-width: 700px) { .sheet-bg { align-items: center; } }
.sheet { background: var(--bg); width: min(640px, 100%); max-height: 92vh; overflow: auto; border-radius: 14px 14px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
@media (min-width: 700px) { .sheet { border-radius: 14px; } }
.sheet h3 { margin: 0; font-family: var(--font-display); font-size: 1.4rem; text-transform: uppercase; }
.sheet .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.sheet .acts .left { margin-right: auto; }

.fab { position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 6; border-radius: 999px; padding: 14px 20px; box-shadow: 0 6px 18px rgba(0,0,0,.18); font-size: 1rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 30; font-size: .9rem; }
.notice { background: var(--sunk); border-radius: var(--radius); padding: 12px 14px; color: var(--muted); font-size: .9rem; }
@media (prefers-reduced-motion: no-preference) { .row, .pt, .chip { transition: border-color .15s, background-color .15s; } }

/* ===== Identité « pas de tir + carnet » ===== */
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; background-attachment: fixed;
  font-size: 16.5px;
}
body::before { background: var(--field); }
/* Bande d'en-tête : le gazon, avec les lignes de tir peintes */
.top { background: var(--field); border-bottom: 0; color: var(--field-ink);
  background-image: repeating-linear-gradient(90deg, transparent 0 63px, rgba(255,255,255,.06) 63px 64px); box-shadow: 0 3px 0 var(--gold); }
.brand h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: .02em; line-height: 1; }
.brand h1 em { font-style: normal; color: var(--gold); }
.brand .sub { color: var(--field-muted); font-family: var(--font-hand); font-size: .95rem; }
.brand svg circle:first-child { stroke: rgba(255,255,255,.4); }
.tab { color: var(--field-muted); font-size: 1.2rem; font-weight: 700; letter-spacing: .06em; padding: 10px 14px 12px; border-bottom-width: 4px; }
.tab:hover { color: var(--field-ink); }
.tab[aria-selected="true"] { color: var(--field-ink); border-bottom-color: var(--gold); }
.tab .n { color: var(--field-muted); font-family: var(--font-display); font-size: .95rem; }
:focus-visible { outline-color: var(--gold); }

/* Titres de section : écrits à la main dans le carnet, soulignés au feutre */
h2.sec { font-family: var(--font-hand); font-weight: 700; text-transform: none; letter-spacing: 0; font-size: 1.35rem; color: var(--accent); margin: 10px 0 -6px;
  background: linear-gradient(transparent 62%, color-mix(in srgb, var(--gold) 38%, transparent) 62% 88%, transparent 88%); width: fit-content; padding: 0 4px; }
.head .m, .crumbs span { font-family: var(--font-hand); font-size: 1.05rem; }
.head h2 { font-size: 2.6rem; font-weight: 800; letter-spacing: .01em; line-height: 1; }
.empty h3, .sheet h3, .el h4, .card h3 { font-weight: 800; letter-spacing: .03em; }
.sheet h3 { font-size: 1.7rem; }

/* Feuilles du carnet : coins nets, bord d'encre fin, ombre de papier posé */
.row, .card, .fold, .pt, .empty { border-radius: var(--radius); border-color: var(--line); box-shadow: 0 1px 0 var(--line); }
.row:hover, .fold:hover { border-color: var(--accent); }
.empty { border-style: dashed; border-width: 2px; background: color-mix(in srgb, var(--surface) 80%, transparent); }
.empty h3 { font-size: 1.6rem; }
.notice { background: transparent; border: 1px dashed var(--line); font-family: var(--font-hand); font-size: 1rem; color: var(--muted); }

/* Chiffres : tableau d'affichage */
.date .d { font-size: 2.1rem; font-weight: 800; }
.date .mo { font-family: var(--font-hand); text-transform: none; letter-spacing: 0; font-size: .9rem; }
.count { font-size: 1.5rem; font-weight: 800; }
.stat b, .score b { font-weight: 800; }
.stat b { font-size: 2.3rem; }
.score b { font-size: 3rem; }
.stat span, .score span { font-family: var(--font-hand); font-size: .95rem; }
.stat { gap: 14px 30px; }

/* Boutons et pastilles */
.btn { border-radius: 4px; border-color: var(--line); font-weight: 700; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 0 var(--field-2); }
.btn.primary:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--field-2); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.btn[data-confirm] { background: var(--danger) !important; color: var(--danger-ink) !important; border-color: var(--danger) !important; }
.fab { border-radius: 4px; font-family: var(--font-display); font-size: 1.25rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 12px 20px; box-shadow: 0 4px 0 var(--field-2), 0 8px 18px rgba(0,0,0,.18); }
.chip { border-radius: 4px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--field); color: var(--field-ink); border-color: var(--field); box-shadow: inset 0 -3px 0 var(--gold); }
.tag { border-radius: 3px; font-weight: 700; letter-spacing: .02em; }
/* étiquettes façon tampon */
.tag.fed { border: 1.5px solid currentColor; color: var(--accent); background: transparent; text-transform: uppercase; font-size: .7rem; transform: rotate(-2deg); }
.tag.today { background: var(--gold); color: #201700; transform: rotate(-2deg); }

/* Champs de saisie : ligne d'écriture */
input[type=search], input[type=text], input[type=date], input[type=time], input[type=number], input[type=month], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 9px 11px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
textarea { background-image: linear-gradient(transparent calc(1.45em + 8px), var(--grid) calc(1.45em + 8px)); background-size: 100% calc(1.45em); line-height: 1.45em; }
label.f, div.f { display: grid; gap: 6px; font-size: .85rem; font-weight: 700; color: var(--muted); }
div.f > .checks label, div.f > .radio label { font-size: .95rem; font-weight: 500; color: var(--ink); }
/* Liseré à la couleur du club sur les séances */
.row.club-edge { border-left: 6px solid var(--club, var(--line)); padding-left: 12px; }
.head.club-edge { border-left: 6px solid var(--club, var(--line)); padding-left: 12px; }

/* Pointage */
.pt { min-height: 64px; }
.pt .nm { font-weight: 700; }
.pt[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); box-shadow: 0 1px 0 var(--ok); }

/* Rouge du blason pour ce qui est négatif */
.s-na, .seg button[aria-pressed="true"][data-v="0"] { background: var(--danger); color: var(--danger-ink); }
.seg { border-radius: 4px; }

/* Graphiques et barres */
.hb .ht span { background: var(--accent); }
.hb .hl { font-family: var(--font-hand); font-size: 1rem; }
svg.chart .ax { font-family: var(--font-body); }
svg.chart .val { font-family: var(--font-display); font-size: 17px; font-weight: 800; }
svg.chart .pt.last { fill: var(--gold); stroke: var(--accent); }
table.vol thead th { font-family: var(--font-display); font-size: .95rem; font-weight: 700; letter-spacing: .04em; }
table.vol td.vs { font-family: var(--font-display); font-size: 1.15rem; font-weight: 800; }

/* Panneaux */
.sheet { background: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; border-top: 4px solid var(--gold); }
.sheet-bg { background: rgba(8, 22, 14, .5); }
.toast { background: var(--field); color: var(--field-ink); border-radius: 4px; box-shadow: 0 3px 0 var(--gold); }
.crumbs { font-weight: 800; font-size: 1.5rem; }
details.pick, .fedbox { border-radius: 4px; }
.fedbox legend { font-weight: 800; color: var(--accent); }
/* Option « titres manuscrits : non » */
body.no-hand h2.sec, body.no-hand .notice, body.no-hand .head .m, body.no-hand .brand .sub, body.no-hand .stat span, body.no-hand .score span,
body.no-hand .date .mo, body.no-hand .hb .hl, body.no-hand .crumbs span { font-family: var(--font-body); }
body.no-hand h2.sec { font-size: 1.1rem; }
/* Saisie de la feuille papier */
table.quick { min-width: 860px; }
table.quick th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 140px; color: var(--ink); }
table.quick td { padding: 4px; }
table.quick td input[type=number] { width: 72px; text-align: center; padding: 8px 4px; font-variant-numeric: tabular-nums; }
table.quick td input[type=text] { min-width: 180px; }
table.quick input.qp { width: 22px; height: 22px; accent-color: var(--ok); }
table.quick tr.absent th, table.quick tr.absent input:not(.qp) { opacity: .5; }
table.quick thead th { white-space: normal; min-width: 64px; }
/* Concours */
.row.past { opacity: .72; }
.row.next-co { border-color: var(--gold); box-shadow: 0 2px 0 var(--gold); }
.date .d small { font-size: .9rem; font-weight: 700; }
.tag.ctype { background: var(--sunk); color: var(--ink); }
.tag.ct-salle { background: color-mix(in srgb, #5b6b7a 22%, transparent); }
.tag.ct-exterieur { background: color-mix(in srgb, var(--gold) 38%, transparent); }
.tag.ct-safari { background: color-mix(in srgb, #6aa84f 32%, transparent); }
.tag.cniv { background: var(--field); color: var(--field-ink); }
.tag.cn-national { background: linear-gradient(90deg, #1f3a93 0 33%, #f3f6ee 33% 66%, #c0352a 66%); color: #10202a; text-shadow: 0 0 3px #fff; }
table.cres { min-width: 520px; }
.ptw { display: grid; gap: 4px; align-content: start; }
.encx { display: inline-flex; gap: 6px; align-items: center; font-size: .85rem; font-weight: 700; color: var(--muted); padding: 2px 6px; }
.encx input { width: 18px; height: 18px; accent-color: var(--gold); }
/* Matériel */
.tag.pret { background: color-mix(in srgb, var(--gold) 30%, transparent); color: var(--ink); border: 1px solid color-mix(in srgb, var(--gold) 70%, transparent); font-size: .72rem; vertical-align: 1px; white-space: nowrap; }
table.mat { min-width: 860px; } table.mat td, table.mat th { white-space: nowrap; } table.mat td.txt { white-space: normal; min-width: 120px; text-align: left; }
table.mat tbody th { font-family: var(--font-display); font-size: 1.25rem; font-weight: 800; color: var(--ink); text-align: center; }
table.mat select { min-width: 130px; padding: 6px 8px; }
.dot.et-bon, select.et-bon { --etc: var(--ok); } .dot.et-surveiller, select.et-surveiller { --etc: var(--gold); }
.dot.et-reparer, select.et-reparer { --etc: #d0662a; } .dot.et-hs, select.et-hs { --etc: var(--danger); }
.dot[class*="et-"] { background: var(--etc); }
select.etat-sel { border-left: 6px solid var(--etc); font-weight: 700; }
tr.et-row-hs { opacity: .6; }
table.imp { min-width: 640px; } table.imp td.txt { white-space: nowrap; } table.imp select { min-width: 160px; } table.imp input[type=number] { width: 80px; }
table.cres select { min-width: 170px; }
.cres-card .grid3 select { min-width: 0; }
table.cres input.score-in { font-weight: 800; font-size: 1.05rem; }
/* Fiches attribuées à un archer */
.attr { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; box-shadow: 0 1px 0 var(--line); }
.attr .lnk { text-align: left; font-size: 1rem; }
.attr.done { opacity: .62; } .attr.done .lnk { text-decoration: line-through; }
.attr textarea.attr-rem { min-height: 54px; font-size: .95rem; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 700; color: var(--muted); padding-right: 6px; border-right: 1px solid var(--line); }
.chk input { width: 22px; height: 22px; accent-color: var(--ok); }
/* Onglet Paramètres poussé à droite, séparé des onglets de travail */
.tab[data-tab="parametres"] { margin-left: auto; }
/* ===== Habillage ArcherHub : nuit, ambre et cyan ===== */
:root, :root:not([data-theme="light"]) {
  --bg: #0B0F19; --grid: transparent; --surface: #0F172A; --sunk: #111a2e; --ink: #F3F4F6; --muted: #94A3B8;
  --line: #1E293B; --line-2: #334155; --field: rgba(11,15,25,.82); --field-2: #78350F; --field-ink: #F3F4F6; --field-muted: #94A3B8;
  --accent: #F59E0B; --accent-2: #D97706; --accent-ink: #0B0F19; --cyan: #06B6D4; --gold: #FFD700; --danger: #EF4444; --danger-ink: #fff;
  --ok: #34D399; --ok-soft: rgba(52,211,153,.14); --p-r: #F87171; --p-b: #60A5FA; --p-v: #4ADE80;
  --font-display: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-hand: "Inter", system-ui, sans-serif; --font-mono: "JetBrains Mono", ui-monospace, monospace; --radius: 16px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F1F5F9; --surface: #FFFFFF; --sunk: #E2E8F0; --ink: #0F172A; --muted: #475569; --line: #E2E8F0; --line-2: #CBD5E1;
  --field: rgba(255,255,255,.85); --field-ink: #0F172A; --field-muted: #475569; --accent: #D97706; --accent-2: #B45309; --accent-ink: #fff;
  --cyan: #0891B2; --gold: #B45309; --danger: #DC2626; --ok: #059669; --ok-soft: #D1FAE5; --p-r: #c8281e; --p-b: #2a5fae; --p-v: #1d8a3a;
  color-scheme: light;
}
body { background: var(--bg); background-image: radial-gradient(1200px 500px at 85% -10%, rgba(245,158,11,.08), transparent 60%), radial-gradient(900px 500px at -10% 10%, rgba(6,182,212,.06), transparent 60%); background-attachment: fixed; font-size: 16px; letter-spacing: -.005em; }
body::before { background: var(--bg); }
.top { background: var(--field); background-image: none; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); box-shadow: none; color: var(--field-ink); }
.brand { gap: 12px; }
.brand .logo { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, #F59E0B, #EA580C); box-shadow: 0 6px 20px rgba(245,158,11,.35); flex: none; }
.brand .logo svg { width: 22px; height: 22px; color: #0B0F19; }
.brand h1 { font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; text-transform: none; line-height: 1.1;
  background: linear-gradient(90deg, var(--ink), var(--muted)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand h1 em { font-style: normal; background: linear-gradient(90deg, #F59E0B, #06B6D4); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand .sub { font-family: var(--font-body); font-size: .8rem; color: var(--muted); }
.tabs { gap: 4px; padding-bottom: 8px; scrollbar-width: none; }
.tab { font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-size: .95rem; font-weight: 600; color: var(--muted); border: 0; border-radius: 12px; padding: 8px 14px; white-space: nowrap; }
.tab:hover { color: var(--ink); background: color-mix(in srgb, var(--line) 70%, transparent); }
.tab[aria-selected="true"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
.tab .n { font-family: var(--font-body); font-size: .75rem; color: inherit; opacity: .7; }
:focus-visible { outline-color: var(--accent); }

.row, .card, .fold, .pt, .empty { border-radius: 20px; border: 1px solid var(--line); background: var(--surface); box-shadow: 0 10px 30px -18px rgba(0,0,0,.6); }
.card { padding: 18px; }
.row { border-radius: 16px; }
.row:hover, .fold:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.empty { border-style: dashed; border-color: var(--line-2); }
.notice { background: color-mix(in srgb, var(--sunk) 70%, transparent); border: 1px solid var(--line); border-radius: 14px; font-family: var(--font-body); font-size: .92rem; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 24px 24px 0 0; }
.sheet-bg { background: rgba(2,6,15,.65); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.sheet h3, .empty h3, .el h4, .card h3 { font-family: var(--font-display); text-transform: none; letter-spacing: -.01em; font-weight: 800; }
.sheet h3 { font-size: 1.35rem; }

h2.sec { font-family: var(--font-body); text-transform: uppercase; letter-spacing: .12em; font-size: .72rem; font-weight: 700; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 999px; padding: 5px 12px; width: fit-content; margin: 12px 0 -4px; }
h2.sec:nth-of-type(even) { color: var(--cyan); background: color-mix(in srgb, var(--cyan) 12%, transparent); border-color: color-mix(in srgb, var(--cyan) 30%, transparent); }
.pill { display: inline-block; width: fit-content; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 999px; padding: 5px 12px; }
.head h2 { font-family: var(--font-display); text-transform: none; font-size: 2.1rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.head .m, .crumbs span { font-family: var(--font-body); font-size: .95rem; }

.btn { border-radius: 12px; border: 1px solid var(--line-2); background: color-mix(in srgb, var(--line) 55%, transparent); font-weight: 600; box-shadow: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: linear-gradient(135deg, #F59E0B, #D97706); border-color: transparent; color: #0B0F19; box-shadow: 0 8px 22px -8px rgba(245,158,11,.6); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.primary:active { transform: translateY(1px); box-shadow: 0 4px 12px -6px rgba(245,158,11,.6); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); background: color-mix(in srgb, var(--danger) 8%, transparent); }
.fab { background: linear-gradient(135deg, #F59E0B, #D97706); color: #0B0F19; border: 0; box-shadow: 0 12px 30px -8px rgba(245,158,11,.65); font-weight: 700; }
input[type=search], input[type=text], input[type=date], input[type=time], input[type=number], input[type=email], select, textarea { border-radius: 12px; border: 1px solid var(--line-2); background: var(--sunk); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.chip { border-radius: 999px; border-color: var(--line-2); background: color-mix(in srgb, var(--line) 50%, transparent); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.radio label { border-radius: 12px; border-color: var(--line-2); }
.tag { border-radius: 8px; background: color-mix(in srgb, var(--line) 80%, transparent); }
.tag.today { background: var(--accent); color: #0B0F19; }
.tag.fed { border-color: var(--line-2); }

.date .d, .count, .stat b, .score b { font-family: var(--font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.date .d { font-size: 1.7rem; font-weight: 800; color: var(--accent); }
.date .mo { font-family: var(--font-body); text-transform: uppercase; letter-spacing: .1em; font-size: .7rem; }
.count { font-size: 1.3rem; }
.stat span, .score span { font-family: var(--font-body); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
.score b { color: var(--accent); }
.key { font-family: var(--font-display); border-radius: 14px; border: 1px solid rgba(0,0,0,.3); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.k-gold { background: #FFD700; } .k-red { background: #EF4444; } .k-blue { background: #06B6D4; color: #0B0F19; } .k-black { background: #1E293B; border-color: #334155; }
.k-miss { background: var(--sunk); border-color: var(--line-2); }
table.vol th, table.vol td { border-bottom-color: var(--line); }

/* Tableau de bord */
.hub-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.hub-stat { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px; display: grid; gap: 4px; position: relative; overflow: hidden; }
.hub-stat::after { content: ""; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 8%, transparent), transparent 70%); pointer-events: none; }
.hub-stat-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.hub-stat b { font-size: 2.2rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hub-stat small { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
.hub-ico { width: 34px; height: 34px; border-radius: 11px; display: inline-grid; place-items: center; flex: none; background: color-mix(in srgb, currentColor 7%, transparent); }
.hub-ico svg { width: 18px; height: 18px; }
.c-gold { color: var(--accent); } .c-cyan { color: var(--cyan); } .c-red { color: var(--danger); } .c-green { color: var(--ok); }
.hub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; align-items: start; }
.hub-h { margin: 0; font-size: 1rem; font-weight: 700; letter-spacing: -.01em; }
.hub-mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.hub-mini > div { background: var(--sunk); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; }
.hub-mini span { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
.hub-mini b { font-size: 1.05rem; }

/* Saisie sur le blason */
.seg-mode { display: inline-flex; padding: 4px; gap: 4px; background: var(--sunk); border: 1px solid var(--line); border-radius: 14px; width: fit-content; }

// ---------- Création des séances d'un mois à partir des créneaux ----------
function monthDates(ym, jour) {
  const [y, m] = ym.split("-").map(Number), out = [], j = JOURS.indexOf(jour);
  for (let d = 1; d <= 31; d++) {
    const dt = new Date(y, m - 1, d, 12); if (dt.getMonth() !== m - 1) break;
    if ((dt.getDay() + 6) % 7 === j) out.push(`${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
  }
  return out;
}

  carnetSubKey = key; S.centrees = []; S.loaded.centrees = !key;
  if (!key || !S.db) return;
  carnetUnsub = S.db.collection("carnetEntrees").where("archerId", "==", S.carnet).where("saison", "==", saisonKey(S.cSaison)).onSnapshot((snap) => {
    S.centrees = snap.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.centrees = true;
    if (isTyping() || $("#sheet").innerHTML) { S.stale = true; return; }

}

};

// Nombre de flèches habituel : 2×30 en salle, 2×36 en extérieur
// Résultat d'un archer : une ou plusieurs distances (séries), le total les additionne
const seriesOf = (r) => (Array.isArray(r.series) && r.series.length ? r.series : [{ distance: r.distance ?? "", blason: r.blason ?? "", nbFleches: r.nbFleches ?? "", score: r.score ?? "" }]);
function seriesTotal(se) {

}

// ---------- Import d'un classement PDF dans un concours ----------
// Le texte du PDF est extrait dans la page (pdf.js) ; un PDF scanné est envoyé en images. Claude ne lit que ce document
// et la liste des archers ; tout ce qu'il propose passe par un écran de vérification avant d'être enregistré.
async function pdfToText(buf) {
  await loadPdfJs();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  let out = "";
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i), tc = await page.getTextContent();
    const rows = new Map();
    tc.items.forEach((it) => { const y = Math.round(it.transform[5]); const k = [...rows.keys()].find((v) => Math.abs(v - y) <= 2) ?? y; if (!rows.has(k)) rows.set(k, []); rows.get(k).push(it); });
    [...rows.entries()].sort((a, b) => b[0] - a[0]).forEach(([, its]) => { out += its.sort((a, b) => a.transform[4] - b.transform[4]).map((x) => x.str).join(" ").replace(/\s+/g, " ").trim() + "\n"; });
    out += `\n--- fin de la page ${i} ---\n`;
  }
  return { text: out, pdf };
}
async function pdfToImages(pdf, max) {
  const blobs = [];
  for (let i = 1; i <= Math.min(pdf.numPages, max); i++) {
    const page = await pdf.getPage(i), base = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: 1600 / base.width });
    const cv = document.createElement("canvas"); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
    blobs.push(await new Promise((r) => cv.toBlob(r, "image/png")));
  }
  return blobs;
}

function arcFromText(t) {
  const x = normName(t);
  if (!x) return [];
  if (/poul|compound|\bco\b/.test(x)) return ["Poulies"];
  if (/barebow|\bbb\b|arc nu/.test(x)) return ["Barebow"];
  if (/droit|longbow/.test(x)) return ["Arc droit"];

  if (/classique|recurve|\bcl\b/.test(x)) return ["Classique"];

}

// ---------- Graphiques de progression ----------
// Courbe simple : une série, axe Y unique, points survolables (title) et dernier point mis en avant.
function lineChart(pts0, { min, max, unit = "", digits = 0 } = {}) {
  const W = 640, H = 220, L = 44, R = 16, T = 14, B = 34;

  const ys = pts.map((p) => p.y);

  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.08; if (min == null) lo -= pad; if (max == null) hi += pad;
  const x = (i) => (pts.length === 1 ? L + (W - L - R) / 2 : L + (i * (W - L - R)) / (pts.length - 1));
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const fmt = (v) => v.toFixed(digits).replace(".", ",") + unit;
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((t) => lo + t * (hi - lo));
  const step = Math.ceil(pts.length / 7);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(" ");
  const area = `${path} L${x(pts.length - 1).toFixed(1)},${H - B} L${x(0).toFixed(1)},${H - B} Z`;
  const last = pts.length - 1;
  const sz = pts.every((p) => p.date); if (sz) pts = pts.map((p) => ({ ...p, sz: saisonOfDate(p.date) }));
  const seas = sz ? [...new Set(pts.map((p) => p.sz))] : [];
  const legend = sz ? `<div class="legend sz-leg">${seas.map((z, k) => `<span><i class="s${k % 2}"></i>Saison ${z - 1}-${z}</span>`).join("")}</div>` : "";
  return `${legend}<div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution sur ${pts.length} mesures">
    ${ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" class="grid"/><text x="${L - 6}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end" class="ax">${fmt(t)}</text>`).join("")}
    ${sz ? seas.map((z, k) => { const i0 = pts.findIndex((p) => p.sz === z), i1 = pts.length - 1 - [...pts].reverse().findIndex((p) => p.sz === z);
      const x0 = i0 === 0 ? L : (x(i0 - 1) + x(i0)) / 2, x1 = i1 === last ? W - R : (x(i1) + x(i1 + 1)) / 2;
      return `<rect x="${x0.toFixed(1)}" y="${T}" width="${(x1 - x0).toFixed(1)}" height="${H - T - B}" class="szb s${k % 2}"/>${k ? `<line x1="${x0.toFixed(1)}" x2="${x0.toFixed(1)}" y1="${T}" y2="${H - B}" class="szl"/>` : ""}`; }).join("") : ""}
    ${pts.length > 1 ? (sz ? seas.map((z, k) => { const idx = pts.map((p, i) => [p, i]).filter(([p]) => p.sz === z).map(([, i]) => i);
        const d = idx.map((i, j) => `${j ? "L" : "M"}${x(i).toFixed(1)},${y(pts[i].y).toFixed(1)}`).join(" ");
        const join = idx[0] > 0 ? `<path d="M${x(idx[0] - 1).toFixed(1)},${y(pts[idx[0] - 1].y).toFixed(1)} L${x(idx[0]).toFixed(1)},${y(pts[idx[0]].y).toFixed(1)}" class="ln join"/>` : "";
        return `${join}${idx.length > 1 ? `<path d="${d} L${x(idx[idx.length - 1]).toFixed(1)},${H - B} L${x(idx[0]).toFixed(1)},${H - B} Z" class="area s${k % 2}"/><path d="${d}" class="ln s${k % 2}"/>` : ""}`; }).join("")
      : `<path d="${area}" class="area"/><path d="${path}" class="ln"/>`) : ""}
    ${pts.map((p, i) => `<g><circle cx="${x(i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="14" class="hit"><title>${esc(p.tip)}</title></circle><circle cx="${x(i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="${i === last ? 6 : 4}" class="${i === last ? "pt last" : "pt"}${sz ? " s" + (seas.indexOf(p.sz) % 2) : ""}"><title>${esc(p.tip)}</title></circle></g>`).join("")}
    ${pts.map((p, i) => (i % step === 0 || i === last ? `<text x="${x(i).toFixed(1)}" y="${H - 12}" text-anchor="middle" class="ax">${esc(p.label)}</text>` : "")).join("")}
    <text x="${Math.min(x(last), W - R - 4).toFixed(1)}" y="${(y(pts[last].y) - 12).toFixed(1)}" text-anchor="${pts.length > 1 ? "end" : "middle"}" class="val">${fmt(pts[last].y)}</text>
  </svg></div>`;
}
function scoreHistory(a) {

    <div class="stat"><div><b>${avg(sel[sel.length - 1].st)}</b><span>moyenne par flèche, dernier tir</span></div><div><b>${best.st.total}</b><span>meilleur total (${best.st.n} fl., ${esc(dObj(best.s.date).toLocaleDateString("fr-FR"))})</span></div><div><b>${sel.length}</b><span>tir${sel.length > 1 ? "s" : ""} enregistré${sel.length > 1 ? "s" : ""}</span></div></div>

async function renderPdf(d, box, zoom) {

  try {
    await loadPdfJs();
    if (!pdfCache[d.assetId]) pdfCache[d.assetId] = fetch(blobUrl(d)).then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then((buf) => window.pdfjsLib.getDocument({ data: buf }).promise);

}

    $("#sheet").innerHTML = ""; toast(manq.length ? `Sauvegarde téléchargée, ${manq.length} fichier${manq.length > 1 ? "s" : ""} introuvable${manq.length > 1 ? "s" : ""}` : "Sauvegarde complète téléchargée");
  } catch (e) {
    console.error(e); if (btn) btn.disabled = false;
    msg(e?.code === "declined" ? "Téléchargement annulé." : e?.code === "too_large" ? "Fichier trop lourd pour cet appareil : fais la sauvegarde complète depuis l'ordinateur, ou choisis « Données seules »." : "Téléchargement impossible, réessaie.");
  }
}

// ---------- Formulaires ----------
function sheet(title, body, { onSave, onDelete, deleteLabel } = {}) {
  const el = $("#sheet");
  el.innerHTML = `<div class="sheet-bg" data-close><form class="sheet" id="sheet-form" novalidate><h3>${esc(title)}</h3>${body}
    <div class="acts">${onDelete ? `<button type="button" class="btn danger left" id="sheet-del">${esc(deleteLabel || "Supprimer")}</button>` : ""}<button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></form></div>`;
  const close = () => { el.innerHTML = ""; if (S.stale) { S.stale = false; render(); } };
  el.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", (e) => { if (e.target === b) close(); }));
  $("#sheet-form").addEventListener("submit", (e) => { e.preventDefault(); const fd = new FormData(e.target); if (onSave(fd, e.target) !== false) close(); });
  if (onDelete) {
    const d = $("#sheet-del");
    d.addEventListener("click", () => {
      if (d.dataset.confirm) { onDelete(); close(); }
      else { d.dataset.confirm = 1; d.textContent = "Confirmer la suppression";  }
    });
  }
  const first = el.querySelector("input:not([type=checkbox]):not([type=hidden]), select"); if (first) setTimeout(() => first.focus(), 30);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab],[data-club],[data-seance],[data-archer],[data-club-edit],[data-toggle],[data-act],[data-suivi],[data-arrow],[data-open-suivi],[data-eval],[data-crit],[data-pf],[data-folder],[data-doc],[data-combo],[data-ctab],[data-cmonth],[data-csaison],[data-centry],[data-cdel-date],[data-attr-del],[data-attr-here],[data-concours],[data-cosaison],[data-co-retirer],[data-cocombo],[data-co-addserie],[data-co-delserie],[data-cls],[data-cls-del],[data-mat],[data-matetat],[data-mattype],[data-saisie],[data-dash-suivi],[data-ptab],[data-acc-del],[data-annonce],[data-partage],[data-tccombo],[data-tcper],[data-tcopen]");
  if (!t || t.closest("#sheet")) return;
  if (t.dataset.dashSuivi) { const [sid, aid] = t.dataset.dashSuivi.split("|"); S.seance = sid; S.suivi = aid; S.tirOpen = null; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.tab) { go(t.dataset.tab); try { history.replaceState(null, "", "#" + t.dataset.tab); } catch (_) {} return; }
  if (t.dataset.toggle) {
    const s = S.seances.find((x) => x.id === S.seance); if (!s) return;
    const set = new Set(s.presents || []); set.has(t.dataset.toggle) ? set.delete(t.dataset.toggle) : set.add(t.dataset.toggle);
    const presents = [...set]; s.presents = presents; render(); patch("seances", s.id, { presents }); return;
  }
  if (t.dataset.folder !== undefined) { S.folder = t.dataset.folder || null; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.tccombo) { S.tcCombo = t.dataset.tccombo; render(); return; }
  if (t.dataset.tcper) { S.tcPer = t.dataset.tcper; render(); return; }
  if (t.dataset.tcopen) { coachTir(t.dataset.tcopen); return; }
  if (t.dataset.annonce) { const n = S.annonces.find((x) => x.id === t.dataset.annonce); if (n && S.canWrite) formAnnonce(n); return; }
  if (t.dataset.partage) { const d = S.documents.find((x) => x.id === t.dataset.partage); if (d) formPartage(d); return; }
  if (t.dataset.doc) { const d = S.documents.find((x) => x.id === t.dataset.doc); if (d) openDoc(d); return; }
  if (t.dataset.act === "new-folder") { formFolder(); return; }
  if (t.dataset.act === "edit-folder") { formFolder(S.dossiers.find((x) => x.id === S.folder)); return; }
  if (t.dataset.act === "upload") { $("#file-in").click(); return; }
  if (t.dataset.act === "pick-exos") { pickExos(); return; }
  if (t.dataset.act === "attr-add") { pickAttr(); return; }
  if (t.dataset.act === "print-sheet") { formPrint(); return; }
  if (t.dataset.act === "print-batch") { formPrintBatch(); return; }
  if (t.dataset.concours) { S.tab = "concours"; S.concoursId = t.dataset.concours; S.archer = null; S.seance = null; S.suivi = null; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.cosaison) { S.coSaison = (S.coSaison || saisonYear()) + Number(t.dataset.cosaison); render(); return; }
  if (t.dataset.cocombo) { S.coCombo = t.dataset.cocombo; render(); return; }
  if (t.dataset.act === "new-concours") { formConcours(); return; }
  if (t.dataset.act === "edit-concours") { formConcours(S.concours.find((x) => x.id === S.concoursId)); return; }
  if (t.dataset.act === "co-inscrire") { formInscrire(); return; }
  if (t.dataset.act === "co-import") { startImport(); return; }
  if (t.dataset.mat) { formMat(S.materiel.find((x) => x.id === t.dataset.mat)); return; }
  if (t.dataset.matetat) { S.matEtat = t.dataset.matetat; render(); return; }
  if (t.dataset.mattype) { S.matType = t.dataset.mattype; render(); return; }
  if (t.dataset.act === "mat-new") { formMat(); return; }
