function buildPayload(entrees) {
  const strip = (o) => { const { id, ...r } = o; return { id, ...r }; };
  return { app: "carnet-entraineur", version: 2, exportedAt: new Date().toISOString(), clubs: S.clubs.map(strip), archers: S.archers.map(strip), seances: S.seances.map(strip), evaluations: S.evaluations.map(strip), grilleEvaluation: GRILLE, carnets: S.carnets.map(strip), carnetEntrees: entrees, dossiers: S.dossiers.map(strip), documents: S.documents.map(strip), parametres: S.parametres.map(strip), attributions: S.attributions.map(strip), concours: S.concours.map(strip), materiel: S.materiel.map(strip) };
}
function exportData() {
  const files = referencedFiles(), tot = files.reduce((n, f) => n + (S.documents.find((d) => d.assetId === f.assetId)?.taille || S.concours.flatMap((c) => c.classements || []).find((k) => k.assetId === f.assetId)?.taille || 0), 0);
  sheet("Télécharger une sauvegarde", `
    <div class="f">Contenu<div class="radio" style="display:grid;gap:6px">
      <label><input type="radio" name="mode" value="zip" checked> Données et fichiers (ZIP) : ${files.length} fichier${files.length > 1 ? "s" : ""} (fiches, classements, règlements), environ ${fmtSize(tot)}</label>
      <label><input type="radio" name="mode" value="json"> Données seules (JSON, léger)</label></div></div>
    <span class="tirline">Le ZIP contient tout pour repartir de zéro : il se restaure avec « Restaurer une sauvegarde », y compris dans un nouveau carnet. Prévois de la place sur l'appareil et une bonne connexion.</span>
    <span class="tirline" id="ex-msg"></span>`, {
    onSave(fd) { runExport(fd.get("mode"), files); return false; },
  });
  const sb = document.querySelector("#sheet button[type=submit]"); if (sb) sb.textContent = "Télécharger";
}
async function runExport(mode, files) {
  const msg = (t) => { const m = $("#ex-msg"); if (m) m.textContent = t; }, btn = document.querySelector("#sheet button[type=submit]");
  const dl = await claude.use("downloads"); if (!dl) { toast("Téléchargement indisponible sur cet appareil"); return; }
  if (btn) btn.disabled = true;
  try {
    msg("Préparation des données…");
    const payload = buildPayload(S.db ? (await S.db.collection("carnetEntrees").get()).docs.map((d) => ({ id: d.id, ...d.data() })) : []);
    if (mode === "json") { await dl.save({ filename: `carnet-entraineur-${todayISO()}.json`, data: JSON.stringify(payload, null, 2) }); $("#sheet").innerHTML = ""; toast("Sauvegarde téléchargée"); return; }
    const out = [], manq = [];
    for (let i = 0; i < files.length; i++) {
      const f = files[i]; msg(`Fichiers : ${i + 1} / ${files.length}…`);
      try { const r = await fetch(BLOB_BASE + f.assetId); if (!r.ok) throw new Error(r.status); const path = `fichiers/${f.assetId}_${safeName(f.nom)}`; out.push({ name: path, data: new Uint8Array(await r.arrayBuffer()) }); f.path = path; }
      catch (e) { manq.push(f.nom); }
    }
    payload.fichiers = files.filter((f) => f.path).map(({ assetId, nom, contentType, path }) => ({ assetId, nom, contentType, path }));
    out.unshift({ name: "sauvegarde.json", data: new TextEncoder().encode(JSON.stringify(payload, null, 2)) });
    msg("Création du ZIP…");
    await dl.save({ filename: `carnet-entraineur-${todayISO()}.zip`, data: zipStore(out) });
    $("#sheet").innerHTML = ""; toast(manq.length ? `Sauvegarde téléchargée, ${manq.length} fichier${manq.length > 1 ? "s" : ""} introuvable${manq.length > 1 ? "s" : ""}` : "Sauvegarde complète téléchargée");
  } catch (e) {
    console.error(e); if (btn) btn.disabled = false;
    msg(e?.code === "declined" ? "Téléchargement annulé." : e?.code === "too_large" ? "Fichier trop lourd pour cet appareil : fais la sauvegarde complète depuis l'ordinateur, ou choisis « Données seules »." : "Téléchargement impossible, réessaie.");
  }
}

function sheet(title, body, { onSave, onDelete, deleteLabel } = {}) {

document.addEventListener("dragover", (e) => { if (S.tab !== "exos" || !S.assets || S.seance || S.archer) return; e.preventDefault(); $("#drop")?.classList.add("over"); });
document.addEventListener("dragleave", (e) => { if (e.target.id === "drop") e.target.classList.remove("over"); });
document.addEventListener("drop", (e) => { if (S.tab !== "exos" || !S.assets) return; e.preventDefault(); $("#drop")?.classList.remove("over"); if (e.dataTransfer?.files?.length) uploadFiles(e.dataTransfer.files); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#sheet").innerHTML) $("#sheet").innerHTML = ""; });

// ---------- Données en direct ----------
function subscribe(col) {
  S.db.collection(col).onSnapshot((snap) => {
    S[col] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (col === "clubs") S.clubs.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    if (col === "parametres") applyParams();
    S.loaded[col] = true;
    $("#sync").textContent = snap.metadata.fromCache ? "Hors ligne · copie locale" : "Synchronisé";
    if (isTyping() || $("#sheet").innerHTML) { S.stale = true; renderTabs(); return; }
    render();
  }, (err) => { $("#sync").textContent = "Synchronisation interrompue"; console.error(err); });
}

try { applyDisplay(); } catch (e) { console.error(e); }
render();
(async () => {
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if (!db) { $("#sync").textContent = "Hors connexion"; render(); return; }
  S.db = db;
  if (user) { const w = await user.can("data.write"); if (w === false) S.canWrite = false; }
  S.seesData = user ? (user.isOwner() || user.canEdit()) : null;
  ["clubs", "archers", "seances", "evaluations", "dossiers", "documents", "carnets", "parametres", "attributions", "concours", "materiel"].forEach(subscribe);
  claude.use("assets").then((as) => { S.assets = as; render(); });
  render();
})();
})();
</script>
