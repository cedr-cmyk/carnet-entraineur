<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Animation tir à l'arc</title>
<!-- V.1.10 : page publique d'une animation (lien ou QR code donné par l'entraîneur), sans compte.
     ?t=… : voir l'animation (règles, jeux, équipes, scores si l'entraîneur l'a choisi) ; &e=… : compter les flèches d'une équipe. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root { --bg: #0B1220; --surface: #121B2E; --sunk: #0E1626; --line: #22314F; --ink: #EEF2F8; --muted: #9AA8C1; --accent: #F59E0B; --accent-ink: #1B1300; --ok: #22C55E; --danger: #EF4444; color-scheme: dark; }
@media (prefers-color-scheme: light) { :root { --bg: #F5F6FA; --surface: #FFFFFF; --sunk: #EEF1F6; --line: #DDE3ED; --ink: #111827; --muted: #4B5563; --accent: #D97706; --accent-ink: #fff; color-scheme: light; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 860px; margin: 0 auto; padding: 16px 16px 60px; }
h1 { font-size: 1.6rem; margin: 6px 0 2px; } h2 { font-size: 1.15rem; margin: 22px 0 8px; } h3 { margin: 0 0 6px; font-size: 1rem; }
.m { color: var(--muted); font-size: .92rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; margin: 10px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.chip { border: 1px solid var(--line); background: var(--sunk); color: var(--ink); border-radius: 999px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--sunk); color: var(--ink); border-radius: 10px; padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer; min-height: 44px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); } .btn:disabled { opacity: .5; }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--sunk); width: 100%; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.list { display: grid; gap: 6px; }
table { width: 100%; border-collapse: collapse; font-size: .95rem; } th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; } th { color: var(--muted); font-weight: 600; font-size: .82rem; }
td.n, th.n { text-align: right; } .scroll { overflow-x: auto; }
details summary { cursor: pointer; font-weight: 700; }
.notice { background: var(--sunk); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; color: var(--muted); }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .grow { flex: 1; }
.tag { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--sunk); border: 1px solid var(--line); color: var(--muted); }
.tag.ok { color: var(--ok); border-color: var(--ok); }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; align-items: end; z-index: 10; }
.sheet { background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-width: 560px; width: 100%; margin: 0 auto; display: grid; gap: 12px; max-height: 92vh; overflow: auto; }
.z { display: grid; grid-template-columns: 1fr 48px 48px 48px; gap: 8px; align-items: center; }
.z output { text-align: center; font-size: 1.4rem; font-weight: 800; } .z .btn { padding: 0; font-size: 1.4rem; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 20; }
.foot { margin-top: 30px; font-size: .8rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main class="wrap" id="app"><p class="m">Chargement de l'animation…</p></main>
<script>
(() => {
  const q = new URLSearchParams(location.search), T = q.get("t") || "", E = q.get("e") || "";
  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const toast = (m) => { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };
  const C = window.CARNET_CONFIG || {};
  if (!T || !window.supabase || !C.supabaseUrl) { app.innerHTML = `<div class="notice">Ce lien n'est pas complet. Demande un nouveau QR code à l'organisateur.</div>`; return; }
  const sb = window.supabase.createClient(C.supabaseUrl, C.supabaseAnonKey, { auth: { persistSession: false, autoRefreshToken: false } });
  let A = null, jeu = null, ouvert = {}, occupe = false;
  const fmtDate = (d) => { try { return new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" }); } catch (e) { return d; } };
  const heure = (ms) => (ms ? new Date(ms).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "");
  const med = (n) => (n === 1 ? "🥇" : n === 2 ? "🥈" : n === 3 ? "🥉" : n);
  const rang = (l, f) => { const r = l.slice().sort((x, y) => f(y) - f(x)); let k = 0; r.forEach((p, i) => { if (i === 0 || f(p) !== f(r[i - 1])) k = i + 1; p.rang = k; }); return r; };
  const para = (t) => String(t || "").split(/\n+/).filter(Boolean).map((l) => `<p style="margin:4px 0">${esc(l)}</p>`).join("");
  async function charger() {
    const { data, error } = await sb.rpc("anim_public", { p_token: T, p_jeton: E || null });
    if (error) { app.innerHTML = `<div class="notice">Impossible d'ouvrir l'animation pour l'instant${/anim_public|function/i.test(error.message) ? " (l'organisateur doit mettre l'appli à jour)" : ""}. Réessaie dans un moment.</div>`; return; }
    if (!data) { app.innerHTML = `<div class="notice">Ce lien n'est plus actif. Demande un nouveau QR code à l'organisateur.</div>`; return; }
    A = data; if (!jeu || !(A.jeux || []).some((j) => j.id === jeu)) jeu = A.jeux?.[0]?.id || null; rendre();
  }
  function rendre() {
    const jeux = A.jeux || [], P = (A.participants || []).map((p) => { const sc = p.scores || {}; return { ...p, sc, total: jeux.reduce((t, j) => t + (Number(sc[j.id]) || 0), 0), joue: jeux.some((j) => sc[j.id] != null) }; });
    let h = `<span class="tag">Animation</span><h1>${esc(A.nom || "Animation")}</h1><p class="m" style="margin:0">${esc([A.date ? fmtDate(A.date) : "", A.lieu].filter(Boolean).join(" · "))}</p>`;
    const avecRegle = jeux.filter((j) => j.regle);
    if (A.regles || avecRegle.length) h += `<details class="card"><summary>📜 Les règles</summary>${A.regles ? `<h3>Règles générales</h3>${para(A.regles)}` : ""}${avecRegle.map((j) => `<h3>${esc(j.nom)}</h3>${para(j.regle)}`).join("")}</details>`;
    if (E && A.equipeInconnue) h += `<div class="notice">Ce lien d'équipe n'est plus valable : demande le nouveau QR code de ton équipe.</div>`;
    const mon = A.monEquipe;
    if (mon) {
      const L = mon.essais?.[jeu] || [], mb = P.filter((p) => mon.membres.includes(p.id)).sort((x, y) => (x.nom || "").localeCompare(y.nom || "", "fr")), j = jeux.find((x) => x.id === jeu);
      const detail = (c) => (c || []).map((n, i) => (Number(n) ? `${esc(j?.zones?.[i]?.nom || "Zone " + (i + 1))} ×${n}` : "")).filter(Boolean).join(" · ") || "Aucune flèche dans les zones";
      const edit = (es) => A.saisie && !es.retenu;
      h += `<div class="card"><h3>Équipe ${esc(mon.nom)} : je compte les flèches</h3>
        <span class="m">${A.saisie ? "Choisis le jeu, lance une partie, puis touche chaque archer pour compter ses flèches. L'organisateur valide ensuite la partie qui compte." : "La saisie est fermée : les scores ne bougent plus."}</span>
        <div class="chips">${jeux.map((x) => `<button class="chip" data-jeu="${esc(x.id)}" aria-pressed="${x.id === jeu}">${esc(x.nom)}</button>`).join("")}</div>
        ${L.length ? "" : `<span class="m">Aucune partie pour l'instant sur ce jeu.</span>`}
        ${L.map((es, k) => { const open = ouvert[es.id] ?? (edit(es) && k === L.length - 1), nb = mb.filter((p) => es.scores?.[p.id]).length;
          return `<div class="card" style="margin:0;background:var(--sunk)"><div class="bar"><button class="btn" data-ouv="${es.id}" aria-expanded="${open}">${open ? "▾" : "▸"} Partie ${k + 1}</button><span class="m">${heure(es.le)} · ${nb}/${mb.length} archers</span>${es.retenu ? `<span class="tag ok">✓ validée</span>` : es.choisi ? `<span class="tag">gardée</span>` : ""}<span class="grow"></span>
            ${A.saisie && L.length > 1 && !es.choisi && !L.some((x) => x.retenu) ? `<button class="btn" data-garder="${es.id}">Garder cette partie</button>` : ""}${edit(es) ? `<button class="btn" data-suppr="${es.id}" aria-label="Supprimer la partie ${k + 1}">✕</button>` : ""}</div>
            ${open ? `<div class="list">${mb.map((p) => { const c = es.scores?.[p.id]; return `<${edit(es) ? `button class="row" data-saisie="${es.id}|${p.id}"` : `div class="row"`}><span><b>${esc(p.nom)}</b><br><span class="m">${c ? detail(c) : edit(es) ? "Pas encore compté · touche pour compter" : "Pas compté"}</span></span>${edit(es) ? "<span>›</span>" : ""}</${edit(es) ? "button" : "div"}>`; }).join("")}</div>` : ""}</div>`; }).join("")}
        ${A.saisie ? `<div><button class="btn primary" data-essai="1">${L.length ? "↻ Refaire une partie" : "+ Lancer la première partie"}</button></div>` : ""}</div>`;
    }
    if (A.scores) {
      const joues = P.filter((p) => p.joue);
      const eqs = (A.equipes || []).map((e) => ({ ...e, total: P.filter((p) => e.membres.includes(p.id)).reduce((t, p) => t + p.total, 0), moi: mon?.id === e.id }));
      h += `<h2>${A.classement ? "🏆 Classement" : "Scores"}</h2>`;
      if (eqs.length) { const r = A.classement ? rang(eqs, (e) => e.total) : eqs;
        h += `<div class="card scroll"><table><thead><tr>${A.classement ? "<th>Place</th>" : ""}<th>Équipe</th><th class="n">Total</th></tr></thead><tbody>${r.map((e) => `<tr>${A.classement ? `<td>${med(e.rang)}</td>` : ""}<td>${esc(e.nom)}</td><td class="n"><b>${e.total}</b></td></tr>`).join("")}</tbody></table></div>`; }
      const r = A.classement ? rang(joues, (p) => p.total) : joues.slice().sort((x, y) => (x.nom || "").localeCompare(y.nom || "", "fr"));
      h += r.length ? `<div class="card scroll"><table><thead><tr>${A.classement ? "<th>Place</th>" : ""}<th>Archer</th>${jeux.map((j) => `<th class="n">${esc(j.nom)}</th>`).join("")}<th class="n">Total</th></tr></thead><tbody>
        ${r.map((p) => `<tr>${A.classement ? `<td>${med(p.rang)}</td>` : ""}<td>${esc(p.nom)}</td>${jeux.map((j) => `<td class="n">${p.sc[j.id] ?? "–"}</td>`).join("")}<td class="n"><b>${p.total}</b></td></tr>`).join("")}</tbody></table></div>`
        : `<div class="notice">Pas encore de score validé. Les résultats arrivent dès que l'organisateur valide les parties.</div>`;
    } else if (!mon) {
      h += `<h2>Participants</h2><div class="card"><span>${P.map((p) => esc(p.nom)).sort((a, b) => a.localeCompare(b, "fr")).join(" · ") || "—"}</span></div>`;
    }
    if (!mon && (A.equipes || []).length) h += `<h2>Équipes</h2><div class="card">${A.equipes.map((e) => `<div><b>${esc(e.nom)}</b> : <span class="m">${e.membres.map((id) => esc(P.find((p) => p.id === id)?.nom || "")).filter(Boolean).join(", ")}</span></div>`).join("")}</div>`;
    h += `<p class="foot">Page de l'animation · Carnet d'entraînement${A.scores ? " · mise à jour automatique" : ""}</p>`;
    app.innerHTML = h;
  }
  async function envoyer(essai, cible, compte, msg) {
    if (occupe) return; occupe = true;
    try { const { data, error } = await sb.rpc("anim_public_essai", { p_token: T, p_jeton: E, p_jeu: jeu, p_essai: essai, p_cible: cible, p_compte: compte }); if (error) throw error; if (msg) toast(msg); await charger(); return data; }
    catch (err) { toast(/trop de fleches/.test(err.message) ? "Trop de flèches pour ce jeu" : /saisie fermee/.test(err.message) ? "La saisie est fermée" : /essai retenu/.test(err.message) ? "Partie déjà validée : elle ne bouge plus" : /lien invalide/.test(err.message) ? "Ce lien n'est plus actif" : "Pas enregistré : " + err.message); }
    finally { occupe = false; }
  }
  function saisie(essaiId, cible) {
    const j = A.jeux.find((x) => x.id === jeu), p = A.participants.find((x) => x.id === cible), es = A.monEquipe.essais?.[jeu]?.find((x) => x.id === essaiId); if (!j || !p || !es) return;
    const c = j.zones.map((_, i) => Number(es.scores?.[cible]?.[i]) || 0), F = Number(A.fleches) || 0, bg = document.createElement("div");
    bg.className = "sheet-bg"; bg.innerHTML = `<form class="sheet"><h3>${esc(p.nom)} · ${esc(j.nom)}</h3><span class="m">Compte les flèches tombées dans chaque zone.</span>
      ${j.zones.map((z, i) => `<div class="z"><b>${esc(z.nom)}</b><button type="button" class="btn" data-z="${i}" data-d="-1" aria-label="Une de moins">−</button><output id="z${i}">${c[i]}</output><button type="button" class="btn" data-z="${i}" data-d="1" aria-label="Une de plus">+</button></div>`).join("")}
      <p class="m" id="zt" style="margin:0"></p>
      <div class="bar">${es.scores?.[cible] ? `<button type="button" class="btn" data-eff>Effacer</button>` : ""}<span class="grow"></span><button type="button" class="btn" data-fermer>Annuler</button><button class="btn primary">Enregistrer</button></div></form>`;
    document.body.appendChild(bg);
    const maj = () => { const n = c.reduce((t, x) => t + x, 0); bg.querySelector("#zt").textContent = F ? `${n} / ${F} flèches dans les zones` : `${n} flèche${n > 1 ? "s" : ""} dans les zones`; bg.querySelectorAll('[data-d="1"]').forEach((b) => (b.disabled = !!F && n >= F)); };
    bg.addEventListener("click", (ev) => {
      if (ev.target === bg || ev.target.closest("[data-fermer]")) { bg.remove(); return; }
      if (ev.target.closest("[data-eff]")) { bg.remove(); envoyer(essaiId, cible, null, "Effacé"); return; }
      const b = ev.target.closest("[data-z]"); if (!b) return; const i = +b.dataset.z, d = +b.dataset.d, n = c.reduce((t, x) => t + x, 0);
      if (d > 0 && F && n >= F) return; c[i] = Math.max(0, Math.min(99, c[i] + d)); bg.querySelector("#z" + i).textContent = c[i]; maj();
    });
    bg.querySelector("form").addEventListener("submit", (ev) => { ev.preventDefault(); bg.remove(); envoyer(essaiId, cible, c, `${p.nom} : c'est noté`); });
    maj();
  }
  app.addEventListener("click", (ev) => {
    const t = ev.target.closest("[data-jeu],[data-ouv],[data-essai],[data-garder],[data-suppr],[data-saisie]"); if (!t) return;
    if (t.dataset.jeu) { jeu = t.dataset.jeu; rendre(); }
    else if (t.dataset.ouv) { ouvert[t.dataset.ouv] = t.getAttribute("aria-expanded") !== "true"; rendre(); }
    else if (t.dataset.essai) envoyer(null, null, null, "Partie lancée : compte les flèches de chacun");
    else if (t.dataset.garder) envoyer(t.dataset.garder, "@garder", null, "C'est noté : l'organisateur va valider cette partie");
    else if (t.dataset.suppr) { if (!t.dataset.ok) { t.dataset.ok = 1; t.textContent = "Supprimer ?"; return; } envoyer(t.dataset.suppr, null, null, "Partie supprimée"); }
    else if (t.dataset.saisie) { const [e, c] = t.dataset.saisie.split("|"); saisie(e, c); }
  });
  charger();
  // résultats : mise à jour toutes les 30 secondes (pas pendant une saisie)
  setInterval(() => { if (!document.hidden && !document.querySelector(".sheet-bg") && !occupe && A) charger(); }, 30000);
})();
</script>
</body>
</html>
